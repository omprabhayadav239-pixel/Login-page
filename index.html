<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean, responsive login and registration interface."
    />
    <title>Welcome back | ABC App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <div class="brand-panel">
          <div class="brand-copy">
            <span class="eyebrow">YOUR SPACE, YOUR PACE</span>
            <h1>Make room for<br />what matters.</h1>
            <p>A little more focus. A lot more possibility.</p>
          </div>

          <div class="brand-footer">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Good things are ahead.</span>
          </div>
          <div class="decor decor-one" aria-hidden="true"></div>
          <div class="decor decor-two" aria-hidden="true"></div>
        </div>

        <div class="form-panel">
          <div class="form-heading">
            <span class="eyebrow" id="form-eyebrow">NICE TO SEE YOU AGAIN</span>
            <h2 id="page-title">Welcome back</h2>
            <p id="form-description">Sign in to pick up where you left off.</p>
          </div>

          <div class="mode-switch" role="tablist" aria-label="Account access">
            <button
              class="mode-button is-active"
              id="login-tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="auth-form"
              data-mode="login"
            >
              Sign in
            </button>
            <button
              class="mode-button"
              id="register-tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="auth-form"
              data-mode="register"
              tabindex="-1"
            >
              Create account
            </button>
          </div>

          <form id="auth-form" novalidate>
            <div class="field">
              <label for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                aria-describedby="email-error"
                required
              />
              <span class="field-error" id="email-error" aria-live="polite"></span>
            </div>

            <div class="field">
              <div class="label-row">
                <label for="password">Password</label>
                <button class="text-link forgot-link" id="forgot-button" type="button">
                  Forgot password?
                </button>
              </div>
              <div class="password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  aria-describedby="password-error"
                  required
                />
                <button
                  class="visibility-toggle"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false"
                  data-target="password"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="password-error" aria-live="polite"></span>
            </div>

            <div class="field is-hidden" id="confirm-field">
              <label for="confirm-password">Confirm password</label>
              <div class="password-wrap">
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Enter your password again"
                  aria-describedby="confirm-password-error"
                  disabled
                />
                <button
                  class="visibility-toggle"
                  type="button"
                  aria-label="Show confirm password"
                  aria-pressed="false"
                  data-target="confirm-password"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                </button>
              </div>
              <span class="field-error" id="confirm-password-error" aria-live="polite"></span>
            </div>

            <label class="remember-row" id="remember-row">
              <input type="checkbox" name="remember" />
              <span class="custom-checkbox" aria-hidden="true"></span>
              <span>Keep me signed in</span>
            </label>

            <button class="submit-button" type="submit">
              <span id="submit-label">Sign in</span>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 10h12m-5-5 5 5-5 5" />
              </svg>
            </button>

            <p class="form-message" id="form-message" aria-live="polite"></p>
          </form>

          <p class="security-note">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="4.5" y="8.5" width="11" height="8" rx="2" />
              <path d="M7 8.5V6a3 3 0 0 1 6 0v2.5" />
            </svg>
            Demo form — details are not sent or stored.
          </p>
        </div>
      </section>
      <footer class="page-footer">
        <span>© 2026 ABC App</span>
        <span>Thoughtfully made for your next step.</span>
      </footer>
    </main>
  </body>
</html>
